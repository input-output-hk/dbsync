name: Debug protoc segfault (x86_64 musl cross)

# Throwaway (Plan/NIX-HYDRA.md Phase 0 blocker): proto-lens-protoc's protoc
# invocation segfaults only in the x86_64 musl cross build. Deps substitute
# from cache.iog.io (Hydra built them), so this fails fast, then replays the
# exact protoc call outside the sandbox and inside the drv's env to find
# what kills it. Store paths below are from GHA run 34353478335 and are
# deterministic for the current flake rev. Delete once diagnosed.

on:
  workflow_dispatch:

env:
  DRV: /nix/store/l0w445zb49xvl4n0mwf1543d9d45fpxl-proto-lens-protobuf-types-lib-proto-lens-protobuf-types-x86_64-unknown-linux-musl-0.7.2.3.drv
  PROTOC: /nix/store/xwwv13jdzppv9idzm3q4qbs5v0py327b-protobuf-35.1/bin/protoc
  PLUGIN: /nix/store/nhihb66ii6l1lvfnyzhq5lkfqp4cx0kh-proto-lens-protoc-exe-proto-lens-protoc-0.9.0.1/bin/proto-lens-protoc
  SRC_TGZ: /nix/store/l8bbqy4qxzjsfvmxaai1c615sxvfcdyh-proto-lens-protobuf-types-0.7.2.3.tar.gz
  IMPORTS: /nix/store/fndxsgs4p5hx6q4q5avdwv4dx7vw6yww-proto-lens-lib-proto-lens-x86_64-unknown-linux-musl-0.7.1.7-data/share/x86_64-unknown-linux-musl-ghc-9.14.1/x86_64-linux-ghc-9.14.1-inplace/proto-lens-0.7.1.7-8KjH7tiLUUSDkLTnNMglIA/proto-lens-imports

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: input-output-hk/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: realize inputs (expected to fail at proto-lens-protobuf-types)
        run: nix build .#dbsync-static --print-build-logs || true

      - name: inspect the binaries
        run: |
          file "$PROTOC" "$PLUGIN"
          echo "--- ldd protoc"; ldd "$PROTOC" || true
          echo "--- ldd plugin"; ldd "$PLUGIN" || true

      - name: replay protoc OUTSIDE the sandbox
        run: |
          tar xf "$SRC_TGZ"
          cd proto-lens-protobuf-types-0.7.2.3
          mkdir -p /tmp/out
          set -x
          "$PROTOC" \
            "--plugin=protoc-gen-haskell=$PLUGIN" \
            --haskell_out=/tmp/out \
            --proto_path=proto-src \
            "--proto_path=$IMPORTS" \
            proto-src/google/protobuf/*.proto proto-src/google/protobuf/compiler/plugin.proto \
            && echo "OUTSIDE SANDBOX: OK" || echo "OUTSIDE SANDBOX: exit $?"

      - name: replay protoc INSIDE the drv's build env (pure)
        run: |
          sudo apt-get install -y strace
          cat > /tmp/replay.sh <<'EOF'
          set -x
          env | sort > /tmp/drv-env.txt
          cd "$(mktemp -d)"
          tar xf "$SRC_TGZ"
          cd proto-lens-protobuf-types-0.7.2.3
          mkdir -p out
          "$PROTOC" \
            "--plugin=protoc-gen-haskell=$PLUGIN" \
            --haskell_out=out \
            --proto_path=proto-src \
            "--proto_path=$IMPORTS" \
            proto-src/google/protobuf/*.proto proto-src/google/protobuf/compiler/plugin.proto \
            && echo "IN DRV ENV: OK" || {
              echo "IN DRV ENV: exit $? — rerunning under strace"
              /usr/bin/strace -f -e trace=execve,openat,mmap,mprotect \
                "$PROTOC" \
                "--plugin=protoc-gen-haskell=$PLUGIN" \
                --haskell_out=out \
                --proto_path=proto-src \
                "--proto_path=$IMPORTS" \
                proto-src/google/protobuf/*.proto proto-src/google/protobuf/compiler/plugin.proto \
                2>&1 | tail -100
            }
          EOF
          chmod +x /tmp/replay.sh
          nix-shell "$DRV" --pure \
            --keep DRV --keep PROTOC --keep PLUGIN --keep SRC_TGZ --keep IMPORTS \
            --run /tmp/replay.sh

      - name: env inside the drv shell
        if: always()
        run: cat /tmp/drv-env.txt || true

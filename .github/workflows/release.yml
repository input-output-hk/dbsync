name: Release

# Tag runs build everything into a *draft* release and push the
# version-tagged image; nothing is announced and `:latest` never moves here.
# Publishing the draft is the human gate — promote-release.yml then flips
# `:latest`. A workflow_dispatch run is the same minus the draft release,
# so the pipeline can be rehearsed from any branch.
#
# Binaries are nix-built (flake.nix) against cache.iog.io: if Hydra already
# built the revision the builds are substitutions (minutes); a cold build
# takes hours but never blocks on IOG infra.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Version & pin consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      node_tag: ${{ steps.meta.outputs.node_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version, node tag, image name
        id: meta
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' dbsync/dbsync.cabal)
          node_tag=$(awk '/location:.*IntersectMBO\/cardano-node$/ { found = 1; next }
                          found && /tag:/ { print $2; exit }' cabal.project)
          [ -n "$version" ] && [ -n "$node_tag" ]
          {
            echo "version=$version"
            echo "node_tag=$node_tag"
            echo "image=ghcr.io/${GITHUB_REPOSITORY@L}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag matches cabal version
        if: github.ref_type == 'tag'
        run: |
          [ "$GITHUB_REF_NAME" = "v${{ steps.meta.outputs.version }}" ] || {
            echo "tag $GITHUB_REF_NAME != v${{ steps.meta.outputs.version }} (dbsync/dbsync.cabal)" >&2
            exit 1
          }

      # Fails if flake.lock's crypto-lib revisions (sodium/secp256k1/blst via
      # iohkNix) drifted from cardano-node's own at the cabal.project tag.
      - name: Crypto pins match cardano-node
        run: scripts/release/check-crypto-pins.sh

  build-linux:
    name: linux/${{ matrix.arch }} static binary
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            asset_arch: x86_64
          # Native arm runner — never QEMU for a GHC build.
          - arch: arm64
            runner: ubuntu-24.04-arm
            asset_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: input-output-hk/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build static binary
        run: nix build .#dbsync-static --print-build-logs

      - name: Static sanity + --help in bare alpine (no glibc at all)
        run: |
          file result/bin/dbsync
          ldd result/bin/dbsync || true
          docker run --rm -v "$PWD/result/bin:/b:ro" alpine /b/dbsync --help

      - name: Tarball
        run: tar -C result/bin -czf "dbsync-$VERSION-linux-${{ matrix.asset_arch }}.tar.gz" dbsync

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-linux-${{ matrix.asset_arch }}
          path: dbsync-*.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS aarch64 tarball
    needs: check
    runs-on: macos-15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: input-output-hk/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build relocatable binary
        run: nix build .#dbsync-macos --print-build-logs

      - name: Smoke test
        run: |
          otool -L result/bin/dbsync
          ./result/bin/dbsync --help

      # bin/ holds the executable plus its rewritten dylibs — ship all of it.
      - name: Tarball
        run: tar -C result/bin -czf "dbsync-$VERSION-macos-aarch64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-macos-aarch64
          path: dbsync-*.tar.gz
          if-no-files-found: error

  docker:
    name: Multi-arch image
    needs: [check, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-linux-*
          path: dist
          merge-multiple: true

      # The Dockerfile COPYs docker/bin/${TARGETARCH}/dbsync.
      - name: Stage binaries per arch
        run: |
          mkdir -p docker/bin/amd64 docker/bin/arm64
          tar -C docker/bin/amd64 -xzf "dist/dbsync-$VERSION-linux-x86_64.tar.gz"
          tar -C docker/bin/arm64 -xzf "dist/dbsync-$VERSION-linux-aarch64.tar.gz"

      # QEMU only runs the image's small apt-get/useradd layers for the
      # arm64 leg — the binary is prebuilt, nothing expensive is emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No :latest here — publishing the draft GitHub Release promotes it
      # (promote-release.yml).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true

      - name: Smoke test (amd64)
        run: docker run --rm "$IMAGE:$VERSION" --help

  # Catches a wrong-architecture binary in the arm64 leg — the amd64 smoke
  # test can't, and buildx won't run the target arch's binary during build.
  smoke-arm64:
    name: arm64 image smoke test
    needs: [check, docker]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker run --rm "$IMAGE:$VERSION" --help

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [check, build-macos, docker, smoke-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            Tested with cardano-node **${{ needs.check.outputs.node_tag }}**.

            Docker image (linux/amd64, linux/arm64):

            ```
            docker pull ${{ needs.check.outputs.image }}:${{ needs.check.outputs.version }}
            ```

            Linux binaries are fully static (musl) — no runtime library
            dependencies, any distro. The macOS binary is native
            aarch64 with its dylibs bundled relocatable — no nix or
            homebrew needed.

name: Nix build check

# Throwaway proving ground for the nix release build (Plan/NIX-HYDRA.md
# Phase 0). Dispatch-only; not part of the release path. Delete once its
# jobs have been folded into release.yml.

on:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: input-output-hk/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix build .#dbsync-static --print-build-logs
      - run: file result/bin/dbsync
      - run: ldd result/bin/dbsync || true
      - name: run --help in bare alpine (no glibc at all)
        run: docker run --rm -v "$PWD/result/bin:/b:ro" alpine /b/dbsync --help
      - uses: actions/upload-artifact@v4
        with:
          name: dbsync-static-x86_64
          path: result/bin/dbsync

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: input-output-hk/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix build .#dbsync-static --print-build-logs
      - run: file result/bin/dbsync
      - run: ldd result/bin/dbsync || true
      - name: run --help in bare alpine (no glibc at all)
        run: docker run --rm -v "$PWD/result/bin:/b:ro" alpine /b/dbsync --help
      - uses: actions/upload-artifact@v4
        with:
          name: dbsync-static-aarch64
          path: result/bin/dbsync

  macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: input-output-hk/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix build .#dbsync-macos --print-build-logs
      - run: otool -L result/bin/dbsync
      - run: codesign -dv result/bin/dbsync
      - run: ./result/bin/dbsync --help
      - uses: actions/upload-artifact@v4
        with:
          name: dbsync-macos-aarch64
          path: result/bin/dbsync
